<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 변경 | NEO ACADEMY</title>
<link rel="stylesheet" href="./css/style.css">
<style>body { visibility: hidden; }</style>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="./js/firebase-init.js"></script>
<script src="./js/auth.js?v=20"></script>
<script>
  const SITE_ROOT = './';
  const ACTIVE_CATEGORY = null;
  window.__authReady = Auth.requireLogin(SITE_ROOT + 'login.html');
</script>
</head>
<body>

<div id="site-header"></div>

<main class="auth-main">
  <form class="auth-card" id="password-form" novalidate>
    <p class="micro-cap placeholder-eyebrow">NEO ACADEMY</p>
    <h1 class="heading-lg">비밀번호 변경</h1>

    <label class="auth-field">
      <span class="caption">현재 비밀번호</span>
      <input type="password" name="current" class="text-input" autocomplete="current-password" required>
    </label>

    <label class="auth-field">
      <span class="caption">새 비밀번호</span>
      <input type="password" name="new" class="text-input" autocomplete="new-password" minlength="8" required>
    </label>

    <label class="auth-field">
      <span class="caption">새 비밀번호 확인</span>
      <input type="password" name="confirm" class="text-input" autocomplete="new-password" minlength="8" required>
    </label>

    <p class="auth-error" id="password-error" hidden></p>
    <p class="auth-success" id="password-success" hidden></p>

    <button type="submit" class="btn-primary">비밀번호 변경</button>
  </form>
</main>

<div id="site-footer"></div>

<script src="./js/layout.js?v=20"></script>
<script>
  var form = document.getElementById('password-form');
  var errorEl = document.getElementById('password-error');
  var successEl = document.getElementById('password-success');
  var submitBtn = form.querySelector('button[type="submit"]');

  window.__authReady.then(function () {
    document.body.style.visibility = 'visible';
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errorEl.hidden = true;
    successEl.hidden = true;

    if (form.new.value !== form.confirm.value) {
      errorEl.textContent = '새 비밀번호가 서로 다릅니다.';
      errorEl.hidden = false;
      return;
    }

    submitBtn.disabled = true;
    Auth.changePassword(form.current.value, form.new.value).then(function (result) {
      submitBtn.disabled = false;
      if (!result.ok) {
        errorEl.textContent = result.message;
        errorEl.hidden = false;
        return;
      }
      form.reset();
      successEl.textContent = '비밀번호가 변경됐습니다.';
      successEl.hidden = false;
    });
  });
</script>
</body>
</html>

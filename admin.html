<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 페이지 | NEO ACADEMY</title>
<link rel="stylesheet" href="./css/style.css">
<style>body { visibility: hidden; }</style>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="./js/firebase-init.js"></script>
<script src="./js/auth.js?v=20"></script>
<script>
  const SITE_ROOT = './';
  const ACTIVE_CATEGORY = null;
  window.__authReady = Auth.requireAdmin(SITE_ROOT + 'login.html');
</script>
</head>
<body>

<div id="site-header"></div>

<main class="page-main">
  <div class="admin-panel">
    <div>
      <p class="micro-cap placeholder-eyebrow">관리자</p>
      <h1 class="heading-lg">선생님 계정 관리</h1>
      <p class="body-md placeholder-desc">선생님 성함을 ID로, 비밀번호를 입력해 계정을 생성하세요. 생성된 ID와 비밀번호로 선생님이 로그인하면 상단 메뉴 기능을 이용할 수 있습니다. 로그인한 선생님은 화면 위쪽에서 언제든 비밀번호를 직접 바꿀 수 있고, 보안을 위해 생성 후에는 관리자도 비밀번호를 다시 조회할 수 없습니다. 비밀번호를 잊어버렸다면 "비밀번호 재설정"으로 새 비밀번호를 정해 알려주세요.</p>
    </div>

    <form class="admin-form" id="teacher-form" novalidate>
      <label class="auth-field">
        <span class="caption">선생님 성함 (ID)</span>
        <input type="text" name="id" class="text-input" required>
      </label>
      <label class="auth-field">
        <span class="caption">비밀번호</span>
        <input type="text" name="password" class="text-input" minlength="8" required>
      </label>
      <button type="submit" class="btn-primary">계정 생성</button>
    </form>
    <p class="auth-error" id="teacher-error" hidden></p>

    <table class="admin-table">
      <thead>
        <tr>
          <th>이름 (ID)</th>
          <th>생성일</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="teacher-table-body"></tbody>
    </table>
  </div>
</main>

<div id="site-footer"></div>

<script src="./js/layout.js?v=20"></script>
<script>
  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function formatDate(iso) {
    var d = new Date(iso);
    return d.getFullYear() + '.' + (d.getMonth() + 1) + '.' + d.getDate();
  }

  function renderTeachers() {
    var tbody = document.getElementById('teacher-table-body');
    return Auth.getTeachers().then(function (teachers) {
      if (teachers.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" class="admin-empty">아직 생성된 선생님 계정이 없습니다.</td></tr>';
        return;
      }

      tbody.innerHTML = teachers.map(function (t) {
        return (
          '<tr>' +
            '<td>' + escapeHtml(t.id) + '</td>' +
            '<td>' + formatDate(t.createdAt) + '</td>' +
            '<td class="admin-actions">' +
              '<button type="button" class="admin-reset" data-id="' + escapeHtml(t.id) + '">비밀번호 재설정</button>' +
              '<button type="button" class="admin-delete" data-uid="' + escapeHtml(t.uid) + '" data-id="' + escapeHtml(t.id) + '">삭제</button>' +
            '</td>' +
          '</tr>'
        );
      }).join('');
    });
  }

  var form = document.getElementById('teacher-form');
  var errorEl = document.getElementById('teacher-error');
  var submitBtn = form.querySelector('button[type="submit"]');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errorEl.hidden = true;
    submitBtn.disabled = true;

    Auth.addTeacher(form.id.value, form.password.value).then(function (result) {
      submitBtn.disabled = false;
      if (!result.ok) {
        errorEl.textContent = result.message;
        errorEl.hidden = false;
        return;
      }

      form.reset();
      renderTeachers();
    });
  });

  document.getElementById('teacher-table-body').addEventListener('click', function (e) {
    var deleteBtn = e.target.closest('.admin-delete');
    if (deleteBtn) {
      if (confirm(deleteBtn.dataset.id + ' 선생님 계정을 삭제할까요?')) {
        Auth.deleteTeacher(deleteBtn.dataset.uid).then(renderTeachers);
      }
      return;
    }

    var resetBtn = e.target.closest('.admin-reset');
    if (resetBtn) {
      var newPassword = prompt(resetBtn.dataset.id + ' 선생님의 새 비밀번호를 입력하세요 (' + Auth.minPasswordLength + '자 이상).');
      if (newPassword === null) return;
      Auth.resetTeacherPassword(resetBtn.dataset.id, newPassword).then(function (result) {
        if (!result.ok) {
          alert(result.message);
          return;
        }
        alert('비밀번호가 재설정됐습니다. 새 비밀번호를 ' + resetBtn.dataset.id + ' 선생님께 전달해주세요.');
        renderTeachers();
      });
    }
  });

  window.__authReady.then(function () {
    document.body.style.visibility = 'visible';
    renderTeachers();
  });
</script>
</body>
</html>

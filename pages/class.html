<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>반별 관리 | NEO ACADEMY</title>
<link rel="stylesheet" href="../css/style.css">
<style>body { visibility: hidden; }</style>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="../js/firebase-init.js"></script>
<script src="../js/auth.js?v=19"></script>
<script>
  const SITE_ROOT = '../';
  const ACTIVE_CATEGORY = 'class';
  window.__authReady = Auth.requireLogin(SITE_ROOT + 'login.html');
</script>
</head>
<body>

<div id="site-header"></div>

<main class="page-main">
  <div class="page-header">
    <h1 class="heading-lg">반별 관리</h1>
    <p class="body-md placeholder-desc">반을 생성하고 학생을 배정하거나 완강 처리할 수 있습니다.</p>
  </div>

  <div class="class-toolbar">
    <button type="button" class="btn-primary" id="add-class-btn">+ 반 추가</button>
  </div>

  <div class="class-list" id="class-list"></div>

  <div class="class-history-toolbar">
    <button type="button" class="btn-secondary" id="history-toggle-btn">History</button>
  </div>
</main>

<div class="modal-overlay" id="class-modal-overlay" hidden>
  <div class="modal-card">
    <h2 class="heading-md">반 추가</h2>
    <form id="class-form">
      <label class="auth-field">
        <span class="caption">반 이름</span>
        <input type="text" name="className" class="text-input" placeholder="예: 수학D" required>
      </label>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="class-modal-cancel">취소</button>
        <button type="submit" class="btn-primary">저장</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="student-select-overlay" hidden>
  <div class="modal-card modal-card-wide">
    <h2 class="heading-md" id="student-select-title">학생 추가</h2>
    <input type="search" id="student-select-search" class="text-input" placeholder="이름, 학교, 학년으로 검색">
    <div class="table-scroll">
      <table class="data-table">
        <thead>
          <tr>
            <th></th>
            <th>이름</th>
            <th>학교</th>
            <th>학년</th>
          </tr>
        </thead>
        <tbody id="student-select-body"></tbody>
      </table>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" id="student-select-cancel">취소</button>
      <button type="button" class="btn-primary" id="student-select-confirm">추가하기</button>
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script src="../js/layout.js?v=19"></script>
<script src="../js/students.js?v=19"></script>
<script src="../js/classes.js?v=19"></script>
<script>
  var classListEl = document.getElementById('class-list');

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function updateStudentFields(student, changes) {
    var data = {
      name: student.name,
      school: student.school,
      grade: student.grade,
      registeredAt: student.registeredAt,
      division: student.division,
      homeroom: student.homeroom,
      classDays: student.classDays,
      studentPhone: student.studentPhone,
      parentPhone: student.parentPhone,
      tuition: student.tuition,
      address: student.address,
      currentClasses: student.currentClasses,
      classHistory: student.classHistory,
      notes: student.notes
    };
    Object.keys(changes).forEach(function (key) { data[key] = changes[key]; });
    return Students.update(student.id, data);
  }

  var expandedClassIds = {};
  var showHistory = false;
  var historyToggleBtn = document.getElementById('history-toggle-btn');

  function render() {
    if (showHistory) {
      renderHistory();
    } else {
      renderClasses();
    }
    historyToggleBtn.textContent = showHistory ? '← 반별 관리로 돌아가기' : 'History';
  }

  async function renderHistory() {
    var completed = await Classes.getCompleted();

    if (completed.length === 0) {
      classListEl.innerHTML = '<p class="table-empty">완강 처리된 반이 없습니다.</p>';
      return;
    }

    classListEl.innerHTML = completed.map(function (cls) {
      var count = (cls.completedStudentIds || []).length;
      return (
        '<div class="class-card">' +
          '<div class="class-card-header">' +
            '<h2 class="heading-md">' + escapeHtml(cls.name) + '<span class="caption class-count"> · 완강 ' + count + '명</span></h2>' +
            '<div class="class-card-actions">' +
              '<a class="btn-secondary" href="./class-attendance.html?id=' + cls.id + '">출결관리</a>' +
              '<a class="btn-secondary" href="./class-test.html?id=' + cls.id + '">테스트</a>' +
              '<button type="button" class="btn-secondary class-revert-btn" data-class-id="' + cls.id + '">되돌리기</button>' +
              '<button type="button" class="btn-danger class-delete-btn" data-class-id="' + cls.id + '">삭제</button>' +
            '</div>' +
          '</div>' +
        '</div>'
      );
    }).join('');
  }

  async function renderClasses() {
    var results = await Promise.all([Classes.getActive(), Students.getAll()]);
    var classes = results[0];
    var studentById = {};
    results[1].forEach(function (s) { studentById[s.id] = s; });

    if (classes.length === 0) {
      classListEl.innerHTML = '<p class="table-empty">등록된 반이 없습니다.</p>';
      return;
    }

    classListEl.innerHTML = classes.map(function (cls) {
      var students = cls.studentIds.map(function (id) { return studentById[id]; }).filter(Boolean);
      students.sort(function (a, b) { return a.name.localeCompare(b.name, 'ko'); });
      var isExpanded = !!expandedClassIds[cls.id];

      var rows = students.length === 0
        ? '<tr><td colspan="3" class="table-empty">등록된 학생이 없습니다.</td></tr>'
        : students.map(function (s) {
            return (
              '<tr>' +
                '<td><a class="cell-link" href="./student-detail.html?id=' + encodeURIComponent(s.id) + '">' + escapeHtml(s.name) + '</a></td>' +
                '<td>' + escapeHtml(s.school) + '</td>' +
                '<td>' + escapeHtml(s.grade) + '</td>' +
              '</tr>'
            );
          }).join('');

      return (
        '<div class="class-card">' +
          '<div class="class-card-header">' +
            '<h2 class="heading-md">' + escapeHtml(cls.name) + '<span class="caption class-count"> · ' + students.length + '명</span></h2>' +
            '<div class="class-card-actions">' +
              '<button type="button" class="btn-secondary class-toggle-btn" data-class-id="' + cls.id + '">' + (isExpanded ? '접어서 보기' : '펼쳐서 보기') + '</button>' +
              '<button type="button" class="btn-secondary class-add-student-btn" data-class-id="' + cls.id + '">+ 학생 추가</button>' +
              '<a class="btn-secondary" href="./class-attendance.html?id=' + cls.id + '">출결관리</a>' +
              '<a class="btn-secondary" href="./class-test.html?id=' + cls.id + '">테스트</a>' +
              '<button type="button" class="btn-complete class-complete-btn" data-class-id="' + cls.id + '">완강처리</button>' +
            '</div>' +
          '</div>' +
          (isExpanded ?
            '<div class="table-scroll">' +
              '<table class="data-table">' +
                '<thead><tr><th>이름</th><th>학교</th><th>학년</th></tr></thead>' +
                '<tbody>' + rows + '</tbody>' +
              '</table>' +
            '</div>'
          : '') +
        '</div>'
      );
    }).join('');
  }

  // ---- 반 추가 ----
  var classOverlay = document.getElementById('class-modal-overlay');
  var classForm = document.getElementById('class-form');

  document.getElementById('add-class-btn').addEventListener('click', function () {
    classForm.reset();
    classOverlay.hidden = false;
    classForm.className.focus();
  });

  document.getElementById('class-modal-cancel').addEventListener('click', function () {
    classOverlay.hidden = true;
  });

  classOverlay.addEventListener('click', function (e) {
    if (e.target === classOverlay) classOverlay.hidden = true;
  });

  classForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    var result = await Classes.add(classForm.className.value);
    if (!result.ok) {
      alert(result.message);
      return;
    }

    // 이미 "현재 수강 수업"에 이 반 이름을 적어둔 학생이 있다면(반을 만들기 전에
    // 엑셀로 먼저 붙여넣은 경우 등) 자동으로 명단에 포함시킨다.
    var newClass = result.class;
    var allStudents = await Students.getAll();
    var matchingIds = allStudents.filter(function (s) {
      return Students.splitClasses(s.currentClasses).indexOf(newClass.name) !== -1;
    }).map(function (s) { return s.id; });
    if (matchingIds.length > 0) {
      await Classes.addStudentsToClass(newClass.id, matchingIds);
    }

    classOverlay.hidden = true;
    renderClasses();
  });

  // ---- 완강처리(반 전체) / 학생 추가 / 펼쳐보기 버튼 ----
  classListEl.addEventListener('click', async function (e) {
    var completeBtn = e.target.closest('.class-complete-btn');
    if (completeBtn) {
      var classId = completeBtn.dataset.classId;
      var cls = await Classes.getById(classId);
      if (!cls) return;
      var students = (await Promise.all(cls.studentIds.map(function (id) { return Students.getById(id); }))).filter(Boolean);
      var confirmMsg = students.length === 0
        ? '"' + cls.name + '" 반을 완강 처리할까요? (현재 등록된 학생 없음)'
        : '"' + cls.name + '" 반을 완강 처리할까요? 현재 학생 ' + students.length + '명이 함께 처리됩니다.';
      if (!confirm(confirmMsg)) return;

      await Promise.all(students.map(function (student) {
        var current = Students.splitClasses(student.currentClasses).filter(function (c) { return c !== cls.name; });
        var history = Students.splitClasses(student.classHistory);
        if (history.indexOf(cls.name) === -1) history.push(cls.name);
        return updateStudentFields(student, {
          currentClasses: Students.joinClasses(current),
          classHistory: Students.joinClasses(history)
        });
      }));

      await Classes.completeClass(classId);
      render();
      return;
    }

    var toggleBtn = e.target.closest('.class-toggle-btn');
    if (toggleBtn) {
      var toggleClassId = toggleBtn.dataset.classId;
      expandedClassIds[toggleClassId] = !expandedClassIds[toggleClassId];
      renderClasses();
      return;
    }

    var addStudentBtn = e.target.closest('.class-add-student-btn');
    if (addStudentBtn) {
      openStudentSelect(addStudentBtn.dataset.classId);
      return;
    }

    var revertBtn = e.target.closest('.class-revert-btn');
    if (revertBtn) {
      var revertClassId = revertBtn.dataset.classId;
      var revertCls = await Classes.getById(revertClassId);
      if (!revertCls) return;
      var completedIds = revertCls.completedStudentIds || [];
      if (!confirm('"' + revertCls.name + '" 반을 되돌릴까요? 완강 처리됐던 학생 ' + completedIds.length + '명이 다시 현재 수강 강좌로 돌아갑니다.')) return;

      var revertStudents = (await Promise.all(completedIds.map(function (id) { return Students.getById(id); }))).filter(Boolean);
      await Promise.all(revertStudents.map(function (student) {
        var history = Students.splitClasses(student.classHistory).filter(function (c) { return c !== revertCls.name; });
        var current = Students.splitClasses(student.currentClasses);
        if (current.indexOf(revertCls.name) === -1) current.push(revertCls.name);
        return updateStudentFields(student, {
          currentClasses: Students.joinClasses(current),
          classHistory: Students.joinClasses(history)
        });
      }));

      await Classes.revertClass(revertClassId);
      showHistory = false;
      render();
      return;
    }

    var deleteBtn = e.target.closest('.class-delete-btn');
    if (deleteBtn) {
      var deleteClassId = deleteBtn.dataset.classId;
      var deleteCls = await Classes.getById(deleteClassId);
      if (!deleteCls) return;
      var studentCount = (deleteCls.completedStudentIds || []).length;
      var examCount = (deleteCls.exams || []).length;
      var dateCount = (deleteCls.attendanceDates || []).length;
      if (!confirm(
        '"' + deleteCls.name + '" 반을 완전히 삭제할까요?\n' +
        '완강 학생 ' + studentCount + '명, 출결 기록 ' + dateCount + '일, 시험 기록 ' + examCount + '개가 모두 사라지며 되돌릴 수 없습니다.'
      )) return;

      await Classes.removeClass(deleteClassId);
      render();
    }
  });

  historyToggleBtn.addEventListener('click', function () {
    showHistory = !showHistory;
    render();
  });

  // ---- 학생 추가 모달 ----
  var selectOverlay = document.getElementById('student-select-overlay');
  var selectTitle = document.getElementById('student-select-title');
  var selectSearch = document.getElementById('student-select-search');
  var selectBody = document.getElementById('student-select-body');
  var selectConfirm = document.getElementById('student-select-confirm');
  var selectCancel = document.getElementById('student-select-cancel');
  var activeClassId = null;

  async function openStudentSelect(classId) {
    activeClassId = classId;
    var cls = await Classes.getById(classId);
    if (!cls) return;
    selectTitle.textContent = cls.name + ' · 학생 추가';
    selectSearch.value = '';
    renderStudentSelect();
    selectOverlay.hidden = false;
    selectSearch.focus();
  }

  async function renderStudentSelect() {
    var cls = await Classes.getById(activeClassId);
    if (!cls) return;
    var query = selectSearch.value.trim().toLowerCase();
    var allStudents = await Students.getAll();
    var candidates = allStudents.filter(function (s) {
      return cls.studentIds.indexOf(s.id) === -1;
    });
    if (query) {
      candidates = candidates.filter(function (s) {
        return [s.name, s.school, s.grade].some(function (f) {
          return (f || '').toLowerCase().indexOf(query) !== -1;
        });
      });
    }

    if (candidates.length === 0) {
      selectBody.innerHTML = '<tr><td colspan="4" class="table-empty">추가할 수 있는 학생이 없습니다.</td></tr>';
      return;
    }

    selectBody.innerHTML = candidates.map(function (s) {
      return (
        '<tr>' +
          '<td><input type="checkbox" class="student-select-checkbox" value="' + s.id + '"></td>' +
          '<td>' + escapeHtml(s.name) + '</td>' +
          '<td>' + escapeHtml(s.school) + '</td>' +
          '<td>' + escapeHtml(s.grade) + '</td>' +
        '</tr>'
      );
    }).join('');
  }

  selectSearch.addEventListener('input', renderStudentSelect);
  selectCancel.addEventListener('click', function () { selectOverlay.hidden = true; });
  selectOverlay.addEventListener('click', function (e) {
    if (e.target === selectOverlay) selectOverlay.hidden = true;
  });

  selectConfirm.addEventListener('click', async function () {
    var cls = await Classes.getById(activeClassId);
    if (!cls) return;
    var checked = Array.prototype.filter.call(
      selectBody.querySelectorAll('.student-select-checkbox'),
      function (cb) { return cb.checked; }
    ).map(function (cb) { return cb.value; });

    if (checked.length > 0) {
      // 반 문서는 트랜잭션 1번으로 한꺼번에 갱신한다(선택한 학생 수만큼 개별
      // 트랜잭션을 동시에 날리면 같은 반 문서에 충돌이 몰려 일부가 누락될 수 있다).
      await Classes.addStudentsToClass(activeClassId, checked);

      var students = await Promise.all(checked.map(function (studentId) { return Students.getById(studentId); }));
      await Promise.all(students.filter(Boolean).map(function (student) {
        var current = Students.splitClasses(student.currentClasses);
        if (current.indexOf(cls.name) === -1) {
          current.push(cls.name);
          return updateStudentFields(student, { currentClasses: Students.joinClasses(current) });
        }
      }));
    }

    selectOverlay.hidden = true;
    renderClasses();
  });

  window.__authReady.then(function () {
    document.body.style.visibility = 'visible';
    render();
  });
</script>
</body>
</html>

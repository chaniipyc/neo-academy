<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>출결 관리 | NEO ACADEMY</title>
<link rel="stylesheet" href="../css/style.css">
<script src="../js/auth.js?v=11"></script>
<script>
  const SITE_ROOT = '../';
  const ACTIVE_CATEGORY = 'class';
  Auth.requireLogin(SITE_ROOT + 'login.html');
</script>
</head>
<body>

<div id="site-header"></div>

<main class="page-main">
  <div class="detail-topbar page-wide">
    <button type="button" class="back-btn" id="back-btn">← 뒤로</button>
  </div>

  <p class="breadcrumb body-md page-wide">
    <a href="./class.html">반별 관리</a>
    <span class="crumb-current" id="breadcrumb-name">/ 반 / 출결 관리</span>
  </p>

  <div class="page-header">
    <h1 class="heading-lg" id="page-title">출결 관리</h1>
    <p class="body-md placeholder-desc">날짜 칸에 날짜를 입력하면 새 열이 생깁니다. 각 칸에서 출석·지각·결석·기타 중 하나를 선택하세요. "기타"를 선택하면 내용을 직접 입력할 수 있습니다. "일괄 출석"은 그 날짜의 전원을 출석으로 채웁니다.</p>
  </div>

  <div class="record-table-wrap" id="record-table-wrap">
    <p class="body-md">불러오는 중입니다...</p>
  </div>
</main>

<div id="site-footer"></div>

<script src="../js/layout.js?v=11"></script>
<script src="../js/students.js?v=11"></script>
<script src="../js/classes.js?v=11"></script>
<script>
  var classId = new URLSearchParams(location.search).get('id');
  var wrap = document.getElementById('record-table-wrap');
  var breadcrumbName = document.getElementById('breadcrumb-name');
  var pageTitle = document.getElementById('page-title');
  var backBtn = document.getElementById('back-btn');

  backBtn.addEventListener('click', function () {
    if (history.length > 1) {
      history.back();
    } else {
      location.href = './class-detail.html?id=' + encodeURIComponent(classId);
    }
  });

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  var STATUS_KEY = { '': 'empty', '출석': 'present', '지각': 'late', '결석': 'absent', '기타': 'other' };

  function parseAttendanceValue(value) {
    if (!value) return { status: '', note: '' };
    if (value === '출석' || value === '지각' || value === '결석') return { status: value, note: '' };
    if (value.indexOf('기타') === 0) {
      return { status: '기타', note: value.slice(2).replace(/^[:：]\s*/, '') };
    }
    return { status: '기타', note: value };
  }

  function buildAttendanceValue(status, note) {
    if (!status) return '';
    if (status !== '기타') return status;
    var trimmed = (note || '').trim();
    return trimmed ? ('기타: ' + trimmed) : '기타';
  }

  function render() {
    var cls = Classes.getById(classId);
    if (!cls) {
      wrap.innerHTML = '<p class="body-md">반 정보를 찾을 수 없습니다.</p>';
      return;
    }

    breadcrumbName.textContent = '/ ' + cls.name + ' / 출결 관리';
    pageTitle.textContent = cls.name + ' · 출결 관리';

    var studentIds = Classes.rosterIds(cls);
    var students = studentIds.map(function (id) { return Students.getById(id); }).filter(Boolean);
    students.sort(function (a, b) { return a.name.localeCompare(b.name, 'ko'); });

    if (students.length === 0) {
      wrap.innerHTML = '<p class="table-empty">등록된 학생이 없습니다.</p>';
      return;
    }

    var dates = Classes.getAttendanceDates(classId);

    var thead =
      '<tr><th>이름</th>' +
        dates.map(function (d) {
          return (
            '<th>' +
              '<div class="exam-header">' +
                '<span>' + d + '</span>' +
                '<div class="header-btn-row">' +
                  '<button type="button" class="btn-secondary btn-tiny bulk-attend-col-btn" data-date="' + d + '">일괄 출석</button>' +
                  '<button type="button" class="btn-danger btn-tiny attendance-delete-btn" data-date="' + d + '">삭제</button>' +
                '</div>' +
              '</div>' +
            '</th>'
          );
        }).join('') +
        '<th class="new-col-header"><div class="exam-header"><input type="date" id="new-date-input" class="exam-date-input"></div></th>' +
      '</tr>';

    var tbody = students.map(function (s) {
      var cells = dates.map(function (d) {
        var value = Classes.getAttendance(classId, d)[s.id] || '';
        var parsed = parseAttendanceValue(value);
        var statusKey = STATUS_KEY[parsed.status];
        var showNote = parsed.status === '기타';
        return (
          '<td class="record-cell attendance-cell status-' + statusKey + '">' +
            '<select class="attendance-select" data-date="' + d + '" data-student-id="' + s.id + '">' +
              '<option value=""' + (parsed.status === '' ? ' selected' : '') + '>-</option>' +
              '<option value="출석"' + (parsed.status === '출석' ? ' selected' : '') + '>출석</option>' +
              '<option value="지각"' + (parsed.status === '지각' ? ' selected' : '') + '>지각</option>' +
              '<option value="결석"' + (parsed.status === '결석' ? ' selected' : '') + '>결석</option>' +
              '<option value="기타"' + (parsed.status === '기타' ? ' selected' : '') + '>기타</option>' +
            '</select>' +
            '<input type="text" class="attendance-note-input"' + (showNote ? '' : ' hidden') + ' placeholder="내용 입력" data-date="' + d + '" data-student-id="' + s.id + '" value="' + escapeHtml(parsed.note) + '">' +
          '</td>'
        );
      }).join('');
      return '<tr><td>' + escapeHtml(s.name) + '</td>' + cells + '<td class="new-col-cell"></td></tr>';
    }).join('');

    wrap.innerHTML =
      '<div class="table-scroll">' +
        '<table class="data-table sticky-first-col">' +
          '<thead>' + thead + '</thead>' +
          '<tbody>' + tbody + '</tbody>' +
        '</table>' +
      '</div>';

    var studentIdOrder = students.map(function (s) { return s.id; });

    function focusNextSelect(date, studentId) {
      var idx = studentIdOrder.indexOf(studentId);
      var nextId = (idx !== -1 && idx < studentIdOrder.length - 1) ? studentIdOrder[idx + 1] : null;
      if (!nextId) return;
      var nextSelect = wrap.querySelector('.attendance-select[data-date="' + date + '"][data-student-id="' + nextId + '"]');
      if (nextSelect) nextSelect.focus();
    }

    wrap.querySelectorAll('.attendance-select').forEach(function (select) {
      select.addEventListener('change', function () {
        var td = select.closest('td');
        var noteInput = td.querySelector('.attendance-note-input');
        var date = select.dataset.date;
        var studentId = select.dataset.studentId;
        var status = select.value;

        td.className = 'record-cell attendance-cell status-' + STATUS_KEY[status];

        if (status === '기타') {
          noteInput.hidden = false;
          Classes.setAttendance(classId, date, studentId, buildAttendanceValue('기타', noteInput.value));
          setTimeout(function () {
            noteInput.focus();
            noteInput.select();
          }, 0);
        } else {
          noteInput.hidden = true;
          noteInput.value = '';
          Classes.setAttendance(classId, date, studentId, status);
          focusNextSelect(date, studentId);
        }
      });
    });

    wrap.querySelectorAll('.attendance-note-input').forEach(function (input) {
      function commit() {
        Classes.setAttendance(classId, input.dataset.date, input.dataset.studentId, buildAttendanceValue('기타', input.value));
      }

      input.addEventListener('change', commit);

      input.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        commit();
        focusNextSelect(input.dataset.date, input.dataset.studentId);
      });
    });

    wrap.querySelectorAll('.bulk-attend-col-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        Classes.bulkMarkAttendance(classId, btn.dataset.date, '출석');
        render();
      });
    });

    wrap.querySelectorAll('.attendance-delete-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (!confirm(btn.dataset.date + ' 출결 기록을 삭제할까요?')) return;
        Classes.removeAttendanceDate(classId, btn.dataset.date);
        render();
      });
    });

    var newDateInput = document.getElementById('new-date-input');
    newDateInput.addEventListener('change', function () {
      if (!newDateInput.value) return;
      Classes.addAttendanceDate(classId, newDateInput.value);
      render();
    });
  }

  render();
</script>
</body>
</html>
